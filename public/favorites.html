<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Recetas favoritas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function () {
      try {
        var raw = localStorage.getItem("recetas-preferences");
        if (!raw) return;
        var prefs = JSON.parse(raw);
        var theme = prefs.theme || "auto";
        var density = prefs.density || "comoda";
        var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var useDark = theme === "dark" || (theme === "auto" && prefersDark);
        if (useDark) document.documentElement.classList.add("theme-dark");
        if (density === "compacta") document.documentElement.classList.add("density-compact");
        document.addEventListener("DOMContentLoaded", function () {
          if (useDark) document.body.classList.add("theme-dark");
          if (density === "compacta") document.body.classList.add("density-compact");
        });
      } catch (e) {}
    })();
  </script>
  <link rel="icon" type="image/png" href="assets/img/imagen.png">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script>
</head>
<body class="page-recipes page-favorites">
  <div class="brand-wrap">
    <a class="brand-chip" href="index.html">
      <img class="brand-logo" src="assets/img/imagen.png" alt="Logo de Recetas caseras">
      <span class="brand-name">Recetas caseras</span>
    </a>
  </div>
  <header class="hero">
    <div class="auth-actions">
      <button type="button" class="ghost danger" id="login-toggle" data-i18n="auth.login">Iniciar sesion</button>
      <div class="user-menu-wrap" id="user-menu-wrap">
        <button type="button" class="ghost user-chip" id="user-menu-toggle">
          <img id="auth-avatar" class="user-avatar" alt="Avatar">
          <span class="auth-user-name" id="auth-user"></span>
          <span aria-hidden="true">&#9662;</span>
        </button>
        <div class="user-menu" id="user-menu">
          <button type="button" class="ghost" id="toggle-form" hidden data-i18n="menu.new_recipe">Nueva receta</button>
          <button type="button" class="ghost" id="my-recipes-btn" data-i18n="menu.my_recipes">Mis recetas</button>
          <button type="button" class="ghost" id="favorites-btn" data-i18n="menu.favorites">Favoritas</button>
          <button type="button" class="ghost" id="profile-btn" data-i18n="menu.profile">Perfil</button>
  
          <button type="button" class="ghost danger" id="logout-btn" data-menu-managed="true" data-i18n="menu.logout">Cerrar sesion</button>
        </div>
      </div>
    </div>
    <h1>Tus favoritas</h1>
  </header>

  <div class="search-bar">
    <input class="search-input" type="search" id="search-receta" placeholder="Buscar recetas favoritas">
  </div>

  <main class="layout">
    <section class="panel list-panel">
      <div class="panel-header">
        <div>
          <p class="eyebrow">Recetas favoritas</p>
        </div>
      </div>
      <div id="recetas" class="recetas-list">
        <p class="empty">No hay recetas favoritas todav&iacute;a.</p>
      </div>
      <div class="pagination" id="pagination" hidden>
        <button type="button" class="ghost" id="prev-page">Anterior</button>
        <span id="page-info"></span>
        <button type="button" class="ghost" id="next-page">Siguiente</button>
      </div>
    </section>
  </main>

    <template id="receta-template">
    <article class="receta">
      <div class="receta-header">
        <h3 class="receta-title"></h3>
        <div class="receta-actions">
          <button type="button" class="ghost star-btn" data-accion="favorita" data-id="" aria-label="Marcar como favorita">&#9734;</button>
          <button type="button" class="ghost featured-toggle" data-accion="destacada" data-id="" aria-label="Cambiar destacada">Destacar</button>
        </div>
      </div>
      <div class="receta-media">
        <img class="receta-img" alt="">
      </div>
      <div class="receta-meta">
        <span class="receta-meta-text"></span>
      </div>
    </article>
  </template>

  <div id="image-lightbox" class="image-lightbox hidden">
    <button type="button" id="close-lightbox">Cerrar</button>
    <img id="lightbox-img" alt="Foto de receta ampliada">
  </div>

  <div class="confirm-overlay" id="confirm-overlay">
    <div class="confirm-modal">
      <p id="confirm-message">&#191;Eliminar de favoritos?</p>
      <div class="confirm-actions">
        <button type="button" class="ghost" id="confirm-cancel">Cancelar</button>
        <button type="button" class="ghost danger" id="confirm-accept">Eliminar</button>
      </div>
    </div>
  </div>

  <script type="module" src="assets/js/user-menu.js"></script>
  <script type="module" src="assets/js/favorites.js"></script>
  <footer class="site-footer">
    <nav class="footer-links" aria-label="Enlaces del pie">
      <a href="#">Condiciones de uso y venta</a>
      <a href="#">Aviso de privacidad</a>
      <a href="#">&Aacute;rea legal</a>
      <a href="#">Cookies</a>
      <a href="#">Publicidad basada en intereses</a>
    </nav>
    <p class="footer-copy">&copy; 2026 Recetas caseras. Todos los derechos reservados.</p>
  </footer>

</body>
</html>
