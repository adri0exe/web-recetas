<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Acceso a Recetas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function () {
      try {
        var raw = localStorage.getItem("recetas-preferences");
        if (!raw) return;
        var prefs = JSON.parse(raw);
        var theme = prefs.theme || "auto";
        var density = prefs.density || "comoda";
        var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var useDark = theme === "dark" || (theme === "auto" && prefersDark);
        if (useDark) document.documentElement.classList.add("theme-dark");
        if (density === "compacta") document.documentElement.classList.add("density-compact");
        document.addEventListener("DOMContentLoaded", function () {
          if (useDark) document.body.classList.add("theme-dark");
          if (density === "compacta") document.body.classList.add("density-compact");
        });
      } catch (e) {}
    })();
  </script>
  <link rel="icon" type="image/png" href="assets/img/imagen.png">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script>
</head>
<body class="auth-body">
  <div class="brand-wrap">
    <a class="brand-chip" href="index.html">
      <img class="brand-logo" src="assets/img/imagen.png" alt="Logo de Recetas caseras">
      <span class="brand-name">Recetas caseras</span>
    </a>
  </div>
  <main class="auth-shell">
    <section class="panel auth-card" id="login-card">
      <p class="eyebrow">Acceso</p>
      <h1>Inicia sesi&oacute;n</h1>
      <form id="login-form" class="stack" autocomplete="off">
        <label class="field">
          <span>Correo</span>
          <input type="email" id="login-email" name="login-email" required placeholder="tu-correo@ejemplo.com">
        </label>
        <label class="field">
          <span>Contrase&ntilde;a</span>
          <input type="password" id="login-password" name="login-password" required placeholder="********">
        </label>
        <div class="auth-actions-row">
          <button type="submit" class="primary" id="login-btn">Entrar</button>
          <button type="button" class="ghost outline" id="forgot-password">Olvid&eacute; mi contrasena</button>
        </div>
        <p class="login-error" id="login-error" hidden></p>
      </form>
      <div class="auth-divider"><span>o</span></div>
      <button type="button" class="social-btn" id="google-btn">Continuar con Google</button>
    </section>

    <section class="panel auth-card" id="signup-card" hidden>
      <p class="eyebrow">Registro</p>
      <h1>Crea tu cuenta</h1>
      <form id="signup-form" class="stack" autocomplete="off">
        <label class="field">
          <span>Correo</span>
          <input type="email" id="signup-email" name="signup-email" required placeholder="tu-correo@ejemplo.com">
        </label>
        <label class="field">
          <span>Contrase&ntilde;a</span>
          <input type="password" id="signup-password" name="signup-password" required placeholder="********">
        </label>
        <label class="field">
          <span>Nombre completo (opcional)</span>
          <input type="text" id="signup-name" name="signup-name" placeholder="Tu nombre">
        </label>
        <label class="field">
          <span>Nombre de usuario (opcional)</span>
          <input type="text" id="signup-username" name="signup-username" placeholder="usuario123">
        </label>
        <button type="submit" class="primary" id="signup-btn">Crear cuenta</button>
        <p class="login-error" id="signup-error" hidden></p>
      </form>
      <p class="muted">¿Ya tienes cuenta? <button type="button" class="ghost linklike" id="to-login">Inicia sesi&oacute;n</button></p>
    </section>

    <div class="auth-status" id="auth-status" hidden></div>
  </main>

  <script type="module" src="assets/js/auth.js"></script>
  <footer class="site-footer">
    <nav class="footer-links" aria-label="Enlaces del pie">
      <a href="#">Condiciones de uso y venta</a>
      <a href="#">Aviso de privacidad</a>
      <a href="#">&Aacute;rea legal</a>
      <a href="#">Cookies</a>
      <a href="#">Publicidad basada en intereses</a>
    </nav>
    <p class="footer-copy">&copy; 2026 Recetas caseras. Todos los derechos reservados.</p>
  </footer>

</body>
</html>
